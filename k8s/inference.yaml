apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: mlops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      containers:
        - name: inference
          image: mlops/inference-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: mlops-shared-config
            - secretRef:
                name: mlops-app-secrets
          env:
            - name: MODEL_URI
              value: s3://ml-artifacts/models/production/model.joblib
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: mlops-app
spec:
  selector:
    app: inference-service
  ports:
    - name: http
      port: 8001
      targetPort: http
