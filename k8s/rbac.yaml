apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-runner
  namespace: mlops-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-kpo-runner
  namespace: mlops-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-kpo-runner
  namespace: mlops-app
subjects:
  - kind: ServiceAccount
    name: airflow-runner
    namespace: mlops-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-kpo-runner
