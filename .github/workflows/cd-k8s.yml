name: CD Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - "airflow/**"
      - "services/**"
      - "config/**"
      - ".github/workflows/cd-k8s.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: "Container image tag to deploy"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cd-k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
      DEPLOY_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      AIRFLOW_CHART_VERSION: "1.15.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.2"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.3"

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Verify cluster access
        run: |
          kubectl version --short
          kubectl get nodes

      - name: Create required namespaces
        run: |
          kubectl create namespace mlops-app --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace mlops-data --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace mlops-sec --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kustomize overlay
        run: kubectl apply -k k8s

      - name: Sync runtime secrets (fallback for first bootstrap)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          kubectl -n mlops-app create secret generic mlops-app-secrets \
            --from-literal=SERVICE_API_KEY="${SERVICE_API_KEY}" \
            --from-literal=GATEWAY_DATABASE_URL="${GATEWAY_DATABASE_URL}" \
            --from-literal=S3_ENDPOINT_URL="${S3_ENDPOINT_URL}" \
            --from-literal=AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
            --from-literal=POSTGRES_DB="${POSTGRES_DB}" \
            --from-literal=POSTGRES_USER="${POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=MINIO_ROOT_USER="${MINIO_ROOT_USER}" \
            --from-literal=MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n mlops-data create secret generic minio-kes-secrets \
            --from-literal=MINIO_KMS_KES_KEY_NAME="${MINIO_KMS_KES_KEY_NAME}" \
            --from-literal=MINIO_KMS_KES_ENDPOINT="${MINIO_KMS_KES_ENDPOINT}" \
            --from-literal=MINIO_KMS_KES_CERT_FILE="${MINIO_KMS_KES_CERT_FILE}" \
            --from-literal=MINIO_KMS_KES_KEY_FILE="${MINIO_KMS_KES_KEY_FILE}" \
            --from-literal=MINIO_KMS_KES_CAPATH="${MINIO_KMS_KES_CAPATH}" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
          GATEWAY_DATABASE_URL: ${{ secrets.GATEWAY_DATABASE_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_KMS_KES_KEY_NAME: ${{ secrets.MINIO_KMS_KES_KEY_NAME }}
          MINIO_KMS_KES_ENDPOINT: ${{ secrets.MINIO_KMS_KES_ENDPOINT }}
          MINIO_KMS_KES_CERT_FILE: ${{ secrets.MINIO_KMS_KES_CERT_FILE }}
          MINIO_KMS_KES_KEY_FILE: ${{ secrets.MINIO_KMS_KES_KEY_FILE }}
          MINIO_KMS_KES_CAPATH: ${{ secrets.MINIO_KMS_KES_CAPATH }}

      - name: Rollout app images
        run: |
          kubectl -n mlops-app set image deployment/gateway-service gateway="ghcr.io/${{ github.repository_owner }}/gateway-service:${DEPLOY_IMAGE_TAG}" || true
          kubectl -n mlops-app set image deployment/inference-service inference="ghcr.io/${{ github.repository_owner }}/inference-service:${DEPLOY_IMAGE_TAG}" || true

      - name: Deploy Airflow with Helm
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace mlops-app \
            --version "${AIRFLOW_CHART_VERSION}" \
            -f k8s/airflow-values.yaml \
            --set images.airflow.tag="${DEPLOY_IMAGE_TAG}"

      - name: Wait for rollouts
        run: |
          kubectl -n mlops-app rollout status deploy/gateway-service --timeout=180s
          kubectl -n mlops-app rollout status deploy/inference-service --timeout=180s

      - name: Smoke checks
        run: |
          kubectl -n mlops-app get pods -o wide
          kubectl -n mlops-data get pods -o wide
          kubectl -n mlops-sec get pods -o wide
