services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: model-artifacts
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: model-artifacts-init
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done
        mc mb -p local/ml-artifacts || true

  inference-service:
    build:
      context: .
      dockerfile: services/inference-service/Dockerfile
    container_name: inference-service
    environment:
      MODEL_URI: ${MODEL_URI}
      INFERENCE_PORT: ${INFERENCE_PORT}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      SEGMENT_RESULTS_BUCKET: ${SEGMENT_RESULTS_BUCKET:-ml-artifacts}
      SEGMENT_RESULTS_PREFIX: ${SEGMENT_RESULTS_PREFIX:-segments}
    ports:
      - "8001:8001"
    depends_on:
      artifact-trainer:
        condition: service_completed_successfully

  artifact-trainer:
    build:
      context: .
      dockerfile: services/inference-service/Dockerfile
    container_name: model-artifacts-trainer
    command:
      - python
      - -m
      - src.training.train
      - --train-path
      - /app/data/processed.csv
      - --test-path
      - /app/data/test_data.csv
      - --production-model-uri
      - ${MODEL_URI}
      - --baseline-model-uri
      - ${BASELINE_MODEL_URI}
      - --report-uri
      - ${REPORT_URI}
      - --feature-schema-uri
      - ${FEATURE_SCHEMA_URI:-s3://ml-artifacts/models/feature_schema.json}
      - --feature-stats-uri
      - ${FEATURE_STATS_URI:-s3://ml-artifacts/models/feature_stats.json}
      - --model-info-uri
      - ${MODEL_INFO_URI:-s3://ml-artifacts/models/model_info.json}
      - --model-registry-uri
      - ${MODEL_REGISTRY_URI:-s3://ml-artifacts/models/model_registry.json}
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL}
      GATEWAY_PORT: ${GATEWAY_PORT}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      DATASET_UPLOADS_BUCKET: ${DATASET_UPLOADS_BUCKET:-ml-artifacts}
      DATASET_UPLOADS_PREFIX: ${DATASET_UPLOADS_PREFIX:-uploads}
      PREDICTION_RESULTS_BUCKET: ${PREDICTION_RESULTS_BUCKET:-ml-artifacts}
      PREDICTION_RESULTS_PREFIX: ${PREDICTION_RESULTS_PREFIX:-prediction-results}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - inference-service

volumes:
  postgres_data:
  minio_data:
