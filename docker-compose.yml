services:
  inference-service:
    build:
      context: .
      dockerfile: services/inference-service/Dockerfile
    container_name: inference-service
    environment:
      MODEL_PATH: /app/models/lgb_model.joblib
      CHURN_THRESHOLD: 0.5
      INFERENCE_PORT: 8001
    ports:
      - "8001:8001"

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      INFERENCE_SERVICE_URL: http://inference-service:8001
      GATEWAY_PORT: 8000
      SERVICE_API_KEY: dev-secret
    ports:
      - "8000:8000"
    depends_on:
      - inference-service
