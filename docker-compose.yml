# Полный стек в Docker: Postgres, MinIO, gateway, inference, Airflow (LocalExecutor + DockerOperator для train).

networks:
  default:
    name: mlops_network

services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: model-artifacts
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: model-artifacts-init
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done
        mc mb -p local/ml-artifacts || true

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW_INFERENCE_BASE_URL: http://inference-service:8001
      AIRFLOW_RETRAIN_SCHEDULE: ${AIRFLOW_RETRAIN_SCHEDULE:-0 2 * * *}
      AIRFLOW_PROMOTION_SCHEDULE: ${AIRFLOW_PROMOTION_SCHEDULE:-0 0 1 * *}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      REQUIRE_UPLOAD_ENCRYPTION: ${REQUIRE_UPLOAD_ENCRYPTION:-true}
      DATASET_UPLOADS_BUCKET: ${DATASET_UPLOADS_BUCKET:-ml-artifacts}
      DATASET_UPLOADS_PREFIX: ${DATASET_UPLOADS_PREFIX:-inference/uploads}
      RETRAIN_SOURCE_DATASETS_BUCKET: ${RETRAIN_SOURCE_DATASETS_BUCKET:-ml-artifacts}
      RETRAIN_SOURCE_DATASETS_PREFIX: ${RETRAIN_SOURCE_DATASETS_PREFIX:-training/uploads}
      RETRAIN_NON_PROMOTED_PREFIX: ${RETRAIN_NON_PROMOTED_PREFIX:-training/non-promoted}
      MODEL_URI: ${MODEL_URI}
      BASELINE_MODEL_URI: ${BASELINE_MODEL_URI}
      REPORT_URI: ${REPORT_URI}
      FEATURE_SCHEMA_URI: ${FEATURE_SCHEMA_URI}
      FEATURE_STATS_URI: ${FEATURE_STATS_URI}
      MODEL_INFO_URI: ${MODEL_INFO_URI}
      MODEL_REGISTRY_URI: ${MODEL_REGISTRY_URI}
      AIRFLOW_SHARED_DIR: /opt/airflow/shared
      AIRFLOW_SHARED_VOLUME: t25--4m_mlops_airflow_shared
      AIRFLOW_DOCKER_NETWORK: mlops_network
      AIRFLOW_TRAIN_IMAGE: ${INFERENCE_SERVICE_IMAGE:-mlops/inference-service:latest}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/project
      - airflow_shared:/opt/airflow/shared
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        (
        airflow users create
        --role Admin
        --username ${AIRFLOW_ADMIN_USERNAME:-admin}
        --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        --firstname Airflow
        --lastname Admin
        --email admin@example.com || true
        )

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW_INFERENCE_BASE_URL: http://inference-service:8001
      AIRFLOW_RETRAIN_SCHEDULE: ${AIRFLOW_RETRAIN_SCHEDULE:-0 2 * * *}
      AIRFLOW_PROMOTION_SCHEDULE: ${AIRFLOW_PROMOTION_SCHEDULE:-0 0 1 * *}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      REQUIRE_UPLOAD_ENCRYPTION: ${REQUIRE_UPLOAD_ENCRYPTION:-true}
      DATASET_UPLOADS_BUCKET: ${DATASET_UPLOADS_BUCKET:-ml-artifacts}
      DATASET_UPLOADS_PREFIX: ${DATASET_UPLOADS_PREFIX:-inference/uploads}
      RETRAIN_SOURCE_DATASETS_BUCKET: ${RETRAIN_SOURCE_DATASETS_BUCKET:-ml-artifacts}
      RETRAIN_SOURCE_DATASETS_PREFIX: ${RETRAIN_SOURCE_DATASETS_PREFIX:-training/uploads}
      RETRAIN_NON_PROMOTED_PREFIX: ${RETRAIN_NON_PROMOTED_PREFIX:-training/non-promoted}
      MODEL_URI: ${MODEL_URI}
      BASELINE_MODEL_URI: ${BASELINE_MODEL_URI}
      REPORT_URI: ${REPORT_URI}
      FEATURE_SCHEMA_URI: ${FEATURE_SCHEMA_URI}
      FEATURE_STATS_URI: ${FEATURE_STATS_URI}
      MODEL_INFO_URI: ${MODEL_INFO_URI}
      MODEL_REGISTRY_URI: ${MODEL_REGISTRY_URI}
      AIRFLOW_SHARED_DIR: /opt/airflow/shared
      AIRFLOW_SHARED_VOLUME: t25--4m_mlops_airflow_shared
      AIRFLOW_DOCKER_NETWORK: mlops_network
      AIRFLOW_TRAIN_IMAGE: ${INFERENCE_SERVICE_IMAGE:-mlops/inference-service:latest}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/project
      - airflow_shared:/opt/airflow/shared
    ports:
      - "8080:8080"
    command:
      - webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-scheduler
    user: root
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW_INFERENCE_BASE_URL: http://inference-service:8001
      AIRFLOW_RETRAIN_SCHEDULE: ${AIRFLOW_RETRAIN_SCHEDULE:-0 2 * * *}
      AIRFLOW_PROMOTION_SCHEDULE: ${AIRFLOW_PROMOTION_SCHEDULE:-0 0 1 * *}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      DATASET_UPLOADS_BUCKET: ${DATASET_UPLOADS_BUCKET:-ml-artifacts}
      DATASET_UPLOADS_PREFIX: ${DATASET_UPLOADS_PREFIX:-inference/uploads}
      RETRAIN_SOURCE_DATASETS_BUCKET: ${RETRAIN_SOURCE_DATASETS_BUCKET:-ml-artifacts}
      RETRAIN_SOURCE_DATASETS_PREFIX: ${RETRAIN_SOURCE_DATASETS_PREFIX:-training/uploads}
      RETRAIN_NON_PROMOTED_PREFIX: ${RETRAIN_NON_PROMOTED_PREFIX:-training/non-promoted}
      MODEL_URI: ${MODEL_URI}
      BASELINE_MODEL_URI: ${BASELINE_MODEL_URI}
      REPORT_URI: ${REPORT_URI}
      FEATURE_SCHEMA_URI: ${FEATURE_SCHEMA_URI}
      FEATURE_STATS_URI: ${FEATURE_STATS_URI}
      MODEL_INFO_URI: ${MODEL_INFO_URI}
      MODEL_REGISTRY_URI: ${MODEL_REGISTRY_URI}
      AIRFLOW_TRAIN_IMAGE: ${INFERENCE_SERVICE_IMAGE:-mlops/inference-service:latest}
      AIRFLOW_DOCKER_NETWORK: mlops_network
      AIRFLOW_SHARED_DIR: /opt/airflow/shared
      AIRFLOW_SHARED_VOLUME: t25--4m_mlops_airflow_shared
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/project
      - airflow_shared:/opt/airflow/shared
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - scheduler

  inference-service:
    image: ${INFERENCE_SERVICE_IMAGE:-mlops/inference-service:latest}
    build:
      context: .
      dockerfile: services/inference-service/Dockerfile
    container_name: inference-service
    environment:
      MODEL_URI: ${MODEL_URI}
      INFERENCE_PORT: ${INFERENCE_PORT}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      SEGMENT_RESULTS_BUCKET: ${SEGMENT_RESULTS_BUCKET:-ml-artifacts}
      SEGMENT_RESULTS_PREFIX: ${SEGMENT_RESULTS_PREFIX:-inference/segments}
    ports:
      - "8001:8001"
    depends_on:
      artifact-trainer:
        condition: service_completed_successfully

  artifact-trainer:
    image: ${INFERENCE_SERVICE_IMAGE:-mlops/inference-service:latest}
    build:
      context: .
      dockerfile: services/inference-service/Dockerfile
    container_name: model-artifacts-trainer
    command:
      - python
      - -m
      - src.training.train
      - --train-path
      - /app/data/processed.csv
      - --test-path
      - /app/data/test_data.csv
      - --production-model-uri
      - ${MODEL_URI}
      - --baseline-model-uri
      - ${BASELINE_MODEL_URI}
      - --report-uri
      - ${REPORT_URI}
      - --feature-schema-uri
      - ${FEATURE_SCHEMA_URI:-s3://ml-artifacts/models/production/feature_schema.json}
      - --feature-stats-uri
      - ${FEATURE_STATS_URI:-s3://ml-artifacts/models/production/feature_stats.json}
      - --model-info-uri
      - ${MODEL_INFO_URI:-s3://ml-artifacts/models/production/model_info.json}
      - --model-registry-uri
      - ${MODEL_REGISTRY_URI:-s3://ml-artifacts/models/registry/model_registry.json}
      - --promote
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      INFERENCE_SERVICE_URL: ${INFERENCE_SERVICE_URL}
      GATEWAY_PORT: ${GATEWAY_PORT}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      # MinIO без KMS: не передаём S3_SSE_* — иначе PutObject с SSE даёт NotImplemented
      REQUIRE_UPLOAD_ENCRYPTION: ${REQUIRE_UPLOAD_ENCRYPTION:-false}
      DATASET_UPLOADS_BUCKET: ${DATASET_UPLOADS_BUCKET:-ml-artifacts}
      DATASET_UPLOADS_PREFIX: ${DATASET_UPLOADS_PREFIX:-inference/uploads}
      RETRAIN_SOURCE_DATASETS_BUCKET: ${RETRAIN_SOURCE_DATASETS_BUCKET:-ml-artifacts}
      RETRAIN_SOURCE_DATASETS_PREFIX: ${RETRAIN_SOURCE_DATASETS_PREFIX:-training/uploads}
      PREDICTION_RESULTS_BUCKET: ${PREDICTION_RESULTS_BUCKET:-ml-artifacts}
      PREDICTION_RESULTS_PREFIX: ${PREDICTION_RESULTS_PREFIX:-inference/results}
      SEGMENT_RESULTS_BUCKET: ${SEGMENT_RESULTS_BUCKET:-ml-artifacts}
      SEGMENT_RESULTS_PREFIX: ${SEGMENT_RESULTS_PREFIX:-inference/segments}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - inference-service

volumes:
  postgres_data:
  minio_data:
  airflow_logs:
  airflow_shared:
